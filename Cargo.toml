reth-storage-overlay = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
reth-tokio-util = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
rocksdb = { version = "0.24.0" }

# Transitive deps pulled in by the vendored `patches/reth-transaction-pool` (versions match
# ethereum-optimism/reth op-v2.6.0-1). Remove once the extra_balance_cost hook lands upstream and the
# patch is dropped.
bitflags = "2.10"
imbl = "7"
rustc-hash = { version = "2.1", default-features = false }
smallvec = "1"

# Transitive deps pulled in by the vendored engine/payload/tasks patches (versions match
# ethereum-optimism/reth op-v2.6.0-1). Remove with the [patch] entries.
crossbeam-utils = "0.8"
dashmap = "6.1"
fdlimit = "0.3.0"
indexmap = "2"
moka = "0.12"
reth-config = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1", default-features = false }
reth-consensus-debug-client = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
reth-engine-tree = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
