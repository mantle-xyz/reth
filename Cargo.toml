# Mantle op-reth Workspace
#
# Structure:
#   op-reth/       — OP Stack execution layer (from ethereum-optimism/optimism, op-reth/v2.8.0)
#   mantle-reth/   — Mantle trait override layer (custom)
#   patches/       — Minimal reth core patches (via [patch])
#
# Dependency strategy: follow the op-reth/v2.8.0 anchor, except where Mantle forks it.
#   reth crates    → ethereum-optimism/reth tag op-v2.6.0-1 (what op-reth/v2.8.0 pins)
#   revm           → mantle-xyz/revm tag v119-mantle.1 (Mantle fee model + op-geth parity)
#   revm-inspectors → mantle-xyz/revm-inspectors tag v0.43.0-mantle.2
#   op-revm / alloy-op-evm / alloy-op-hardforks / op-alloy → mantle-xyz/mantle-v2
#   alloy-evm      → crates.io 0.39.0 (upstream, no Mantle patches; see mantle-v2#359)
#   alloy base     → crates.io 2.4.2
#
# revm and revm-inspectors are pinned by tag; mantle-v2 by rev until its sync is tagged.

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["Mantle Core Contributors"]
homepage = "https://github.com/mantle-xyz/reth"
repository = "https://github.com/mantle-xyz/reth"
exclude = ["**/target"]
keywords = ["ethereum", "optimism", "crypto"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[workspace]
resolver = "2"
members = [
  # Op-Reth (from upstream ethereum-optimism/optimism, op-reth/v2.4.2)
  "op-reth/bin/",
  "op-reth/crates/chainspec/",
  "op-reth/crates/cli/",
  "op-reth/crates/consensus/",
  "op-reth/crates/evm/",
  "op-reth/crates/flashblocks/",
  "op-reth/crates/hardforks/",
  "op-reth/crates/node/",
  "op-reth/crates/payload/",
  "op-reth/crates/post-exec-replay/",
  "op-reth/crates/primitives/",
  "op-reth/crates/reth/",
  "op-reth/crates/rpc/",
  "op-reth/crates/sdm-fixture-node/",
  "op-reth/crates/storage/",
  "op-reth/crates/exex/",
  "op-reth/crates/trie/",
  "op-reth/crates/txpool/",
  # Sibling of op-reth in the anchor's rust/ tree, vendored at the same level here.
  "op-version/",

  # Mantle-Reth
  "mantle-reth/crates/cli/",
  "mantle-reth/crates/chainspec/",
  "mantle-reth/crates/flashblocks/",
  "mantle-reth/crates/flashblocks-types/",
  "mantle-reth/crates/rpc-ext/",
  "mantle-reth/crates/eth-api/",
  "mantle-reth/crates/integration-tests/",
  "mantle-reth/crates/preconf/",
  "mantle-reth/crates/ws-proxy/",

  # Run regression tests for these backports in workspace CI.
  "patches/reth-trie/",
  "patches/reth-trie-common/",
  "patches/reth-trie-sparse/",
  "patches/reth-exex/",
  "patches/reth-tasks/",
  "patches/reth-cli-runner/",

  # Optimism ecosystem crates (from mantle-xyz/mantle-v2, git dependency)
  # (no longer workspace members — referenced via git dep)
]
default-members = [
  "mantle-reth/crates/cli/",
]

# ==================== WORKSPACE LINTS ====================
[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = { level = "deny", priority = -1 }
unnameable-types = "warn"
rust-2024-incompatible-pat = "warn"
# Vendored reth-node-metrics uses `cfg(tokio_unstable)`; same as upstream reth.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
doc_markdown = "warn"
use-self = "warn"
# Allow patterns common in Mantle code
cognitive_complexity = "allow"
result_large_err = "allow"
too_long_first_doc_paragraph = "allow"

# ==================== PROFILES ====================
[profile.dev]
opt-level = 1
overflow-checks = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.hivetests]
inherits = "test"
opt-level = 3
lto = "thin"

# ==================== WORKSPACE DEPENDENCIES ====================
[workspace.dependencies]

# Transitive deps pulled in by the vendored `patches/reth-provider` (versions match
# ethereum-optimism/reth op-v2.6.0-1). Remove once the hashed-snapshot exec-read fix lands upstream
# and the [patch] entry for reth-provider is dropped.
reth-nippy-jar = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
reth-node-types = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
