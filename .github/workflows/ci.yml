name: ci

on:
  # `branches` filters on the base branch, and this repo has no fallback workflow:
  # a branch missing here gets no CI at all.
  pull_request:
    branches: [mantle-stage2, main, "dev/**", "release/**"]
  push:
    branches: [mantle-stage2, main, "dev/**", "release/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Incremental artifacts slow down a clean build and only enlarge the cached target/.
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # Only pushes to the branches above save the cache. PR and manual runs restore
      # from their base or the default branch and save nothing: every saved cache is
      # several GB, all of them share the repository's quota, and caches written by PR
      # runs were evicting the base branch's, so those runs rebuilt from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - uses: extractions/setup-just@v2
      - run: just fmt
      - run: just clippy

  test:
    name: test
    runs-on: ubuntu-latest
    # Measured 50–59 min on a Swatinem cache miss (eight runs, 2026-10-15/16),
    # almost all of it compilation; see the `test-ci` recipe in `justfile`.
    # The old 60 left single-digit minutes of headroom.
    timeout-minutes: 90
    # Tests compile a lot of code; do not fail the build on warnings here
    # (warnings are already gated by the clippy job above).
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      # Same policy as the lint job: only pushes save the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: just test-ci
      # A test that passed only on a retry is a `FLAKY` line somewhere in the
      # thousands above. This puts it on the run's summary page as a warning;
      # it does not fail the job.
      - name: Annotate retried passes
        if: always()
        run: |
          python3 - <<'EOF'
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("target/nextest/default/junit.xml")
          if not report.exists():
              raise SystemExit
          for case in ET.parse(report).getroot().iter("testcase"):
              if case.find("flakyFailure") is not None or case.find("flakyError") is not None:
                  print(
                      f"::warning title=flaky test::{case.get('classname')} "
                      f"{case.get('name')} passed only after a retry"
                  )
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
