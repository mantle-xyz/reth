name: ci

on:
  # `branches` filters on the base branch, and this repo has no fallback workflow:
  # a branch missing here gets no CI at all.
  pull_request:
    branches: [mantle-stage2, main, "dev/**", "release/**"]
  push:
    branches: [mantle-stage2, main, "dev/**", "release/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # sccache caches individual rustc compilations across runs — including the cfg(test)
  # builds and git-dependency crates that Swatinem's target/ cache misses. Today ~250
  # upstream op-reth/revm/alloy crates recompile on every PR *despite* a Swatinem cache
  # hit (they rebuild because cargo's per-run fingerprints differ); sccache replays their
  # cached object output instead. Requires incremental compilation to be off.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # Install sccache before any cargo step so RUSTC_WRAPPER resolves.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
      - run: just fmt
      - run: just clippy
      - run: sccache --show-stats

  test:
    name: test
    runs-on: ubuntu-latest
    # Measured 50–59 min on a Swatinem cache miss (eight runs, 2026-10-15/16),
    # almost all of it compilation; see the `test-ci` recipe in `justfile`.
    # The old 60 left single-digit minutes of headroom.
    timeout-minutes: 90
    # Tests compile a lot of code; do not fail the build on warnings here
    # (warnings are already gated by the clippy job above).
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: just test-ci
      # A test that passed only on a retry is a `FLAKY` line somewhere in the
      # thousands above. This puts it on the run's summary page as a warning;
      # it does not fail the job.
      - name: Annotate retried passes
        if: always()
        run: |
          python3 - <<'EOF'
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("target/nextest/default/junit.xml")
          if not report.exists():
              raise SystemExit
          for case in ET.parse(report).getroot().iter("testcase"):
              if case.find("flakyFailure") is not None or case.find("flakyError") is not None:
                  print(
                      f"::warning title=flaky test::{case.get('classname')} "
                      f"{case.get('name')} passed only after a retry"
                  )
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
      - run: sccache --show-stats
