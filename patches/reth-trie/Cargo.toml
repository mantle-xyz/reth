[package]
name = "reth-trie"
version = "2.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Merkle trie implementation [MANTLE PATCH: backport paradigmxyz/reth#28264 trie iterator seek boundary fix]"

[lints]
workspace = true

[dependencies]
# reth
reth-execution-errors.workspace = true
reth-primitives-traits = { workspace = true, features = ["std"] }
reth-stages-types.workspace = true
reth-storage-errors.workspace = true
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", rev = "88505c7fcbfdebfd3b56d88c86b62e950043c6c4" }
reth-trie-common = { workspace = true, features = ["rayon"] }

revm-database.workspace = true

# alloy
alloy-eips.workspace = true
alloy-rlp.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-trie.workspace = true

# tracing
tracing = { workspace = true, features = ["attributes"] }

# misc
auto_impl.workspace = true
itertools = { version = "0.14", default-features = false }

# `metrics` feature
reth-metrics = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }

# `test-utils` feature
triehash = { version = "0.8", optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
# reth
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
reth-tracing.workspace = true
reth-trie-common = { workspace = true, features = ["test-utils", "arbitrary"] }

# revm
revm-state.workspace = true

# trie
triehash = "0.8"

# misc
assert_matches.workspace = true
parking_lot.workspace = true
pretty_assertions = "1.4"
proptest-arbitrary-interop.workspace = true
proptest.workspace = true
rand.workspace = true

[features]
metrics = ["reth-metrics", "dep:metrics"]
serde = [
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-eips/serde",
    "reth-trie-common/serde",
    "reth-primitives-traits/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-eips/serde",
    "reth-trie-common/serde",
    "revm-database/serde",
    "reth-stages-types/serde",
    "revm-state/serde",
    "parking_lot/serde",
    "rand/serde",
]
test-utils = [
    "triehash",
    "parking_lot",
    "reth-primitives-traits/test-utils",
    "reth-trie-common/test-utils",
    "reth-trie-sparse/test-utils",
    "reth-stages-types/test-utils",
]
serde-bincode-compat = [
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "reth-trie-common/serde-bincode-compat",
]

