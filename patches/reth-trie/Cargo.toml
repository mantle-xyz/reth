[package]
name = "reth-trie"
version = "2.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Merkle trie implementation [MANTLE PATCH: vendored from ethereum-optimism/reth op-v2.6.0-1]"

[lints]
workspace = true

[dependencies]
# reth
reth-execution-errors.workspace = true
reth-primitives-traits = { workspace = true, features = ["std"] }
reth-stages-types.workspace = true
reth-storage-errors.workspace = true
reth-trie-sparse = { workspace = true, features = ["std"] }
reth-trie-common = { workspace = true, features = ["rayon"] }

# alloy
alloy-eips.workspace = true
alloy-rlp.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-trie.workspace = true

# revm
revm.workspace = true

# tracing
tracing = { version = "0.1.0", default-features = false, features = ["attributes"] }

# misc
auto_impl.workspace = true
itertools.workspace = true

# `metrics` feature
reth-metrics = { workspace = true, optional = true }
metrics = { version = "0.24.0", optional = true }

# `test-utils` feature
triehash = { version = "0.8", optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
# reth
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
reth-tracing = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
reth-trie-common = { workspace = true, features = ["test-utils", "arbitrary"] }

# trie
triehash = { version = "0.8" }

# misc
assert_matches.workspace = true
criterion = { package = "codspeed-criterion-compat", version = "4.3" }
parking_lot.workspace = true
pretty_assertions = { version = "1.4" }
proptest-arbitrary-interop.workspace = true
proptest.workspace = true
rand.workspace = true

[features]
metrics = ["reth-metrics", "dep:metrics"]
serde = [
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-eips/serde",
    "reth-trie-common/serde",
    "reth-primitives-traits/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-eips/serde",
    "reth-trie-common/serde",
    "reth-stages-types/serde",
    "parking_lot/serde",
    "rand/serde",
    "revm/serde",
]
test-utils = [
    "triehash",
    "parking_lot",
    "reth-primitives-traits/test-utils",
    "reth-trie-common/test-utils",
    "reth-trie-sparse/test-utils",
    "reth-stages-types/test-utils",
]
serde-bincode-compat = [
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "reth-trie-common/serde-bincode-compat",
]

[[bench]]
name = "proof_v2"
required-features = ["test-utils"]
harness = false
