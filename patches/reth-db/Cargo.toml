[package]
name = "reth-db"
version = "2.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Database primitives used in reth. [MANTLE PATCH: backport reth#28064, reth#28405 on ethereum-optimism/reth op-v2.6.0-1]"

[lints]
workspace = true

[dependencies]
# reth
reth-db-api.workspace = true
reth-fs-util.workspace = true
reth-storage-errors.workspace = true
reth-nippy-jar.workspace = true
reth-tracing = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1" }
tracing = { version = "0.1.0", default-features = false, features = ["attributes"] }
reth-static-file-types.workspace = true
reth-primitives-traits = { workspace = true, optional = true, features = ["quanta"] }

# ethereum
alloy-primitives.workspace = true

# mdbx
reth-libmdbx = { git = "https://github.com/ethereum-optimism/reth", tag = "op-v2.6.0-1", features = ["return-borrowed", "read-tx-timeouts"], optional = true }
eyre = { workspace = true, optional = true }

# metrics
reth-metrics = { workspace = true, optional = true }
metrics = { version = "0.24.0", optional = true }

# misc
page_size = { version = "0.6.0", optional = true }
thiserror.workspace = true
tempfile = { workspace = true, optional = true }
derive_more = { version = "2", default-features = false, features = ["full"] }
rustc-hash = { workspace = true, optional = true, features = ["std"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
parking_lot = { workspace = true, optional = true }

# arbitrary utils
strum = { workspace = true, features = ["derive"], optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# reth libs with arbitrary
reth-primitives-traits = { workspace = true, features = ["reth-codec"] }
reth-prune-types.workspace = true

alloy-primitives = { workspace = true, features = ["getrandom"] }
alloy-consensus.workspace = true

serde_json.workspace = true
tempfile.workspace = true
parking_lot.workspace = true

serde.workspace = true

arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true

assert_matches.workspace = true

[features]
default = ["mdbx"]
mdbx = [
    "dep:reth-libmdbx",
    "dep:eyre",
    "dep:page_size",
    "dep:reth-primitives-traits",
    "reth-metrics",
    "dep:metrics",
    "dep:strum",
    "dep:rustc-hash",
]
test-utils = [
    "dep:tempfile",
    "mdbx",
    "arbitrary",
    "parking_lot",
    "reth-db-api/test-utils",
    "reth-nippy-jar/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-prune-types/test-utils",
]
arbitrary = [
    "reth-db-api/arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-consensus/arbitrary",
    "reth-primitives-traits/arbitrary",
    "reth-prune-types/arbitrary",
]
disable-lock = []
