[package]
name = "reth-db-api"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Database abstraction used in reth. [MANTLE PATCH: backport reth#28067 at aef8d3ef]"

[lints]
workspace = true

[dependencies]
# reth
reth-codecs.workspace = true
reth-db-models = { git = "https://github.com/paradigmxyz/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false, features = ["serde", "reth-codec"] }
reth-ethereum-primitives = { workspace = true, features = ["serde", "reth-codec"] }
reth-primitives-traits = { workspace = true, features = ["serde", "reth-codec"] }
reth-stages-types = { workspace = true, features = ["serde", "reth-codec"] }
reth-prune-types = { workspace = true, features = ["serde", "reth-codec"] }
reth-storage-errors.workspace = true
reth-trie-common.workspace = true

# ethereum
alloy-primitives.workspace = true
alloy-consensus.workspace = true

# codecs
modular-bitfield.workspace = true
roaring = "0.11.3"
serde = { workspace = true, default-features = false }

# metrics
metrics.workspace = true

# misc
arrayvec = { version = "0.7.6", default-features = false }
derive_more.workspace = true
bytes.workspace = true

# arbitrary utils
arbitrary = { workspace = true, features = ["derive"], optional = true }
proptest = { workspace = true, optional = true }

[dev-dependencies]
# reth libs with arbitrary
reth-codecs = { workspace = true, features = ["test-utils"] }
reth-db-models = { git = "https://github.com/paradigmxyz/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false, features = ["arbitrary"] }

alloy-primitives = { workspace = true, features = ["rand"] }
rand.workspace = true

test-fuzz.workspace = true

arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true
proptest-arbitrary-interop.workspace = true

[features]
test-utils = [
    "arbitrary",
    "reth-primitives-traits/test-utils",
    "reth-codecs/test-utils",
    "reth-db-models/test-utils",
    "reth-trie-common/test-utils",
    "reth-prune-types/test-utils",
    "reth-stages-types/test-utils",
    "reth-ethereum-primitives/test-utils",
]
arbitrary = [
    "reth-db-models/arbitrary",
    "dep:arbitrary",
    "dep:proptest",
    "reth-primitives-traits/arbitrary",
    "reth-trie-common/arbitrary",
    "alloy-primitives/arbitrary",
    "reth-codecs/arbitrary",
    "reth-prune-types/arbitrary",
    "reth-stages-types/arbitrary",
    "alloy-consensus/arbitrary",
    "reth-ethereum-primitives/arbitrary",
]
