[package]
name = "reth-trie-parallel"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Parallel implementation of merkle root algorithm [MANTLE PATCH: backport reth#27252, #26421 at aef8d3ef]"

[lints]
workspace = true

[dependencies]
# reth
reth-primitives-traits = { workspace = true, features = ["dashmap", "std"] }
reth-execution-errors.workspace = true
reth-provider.workspace = true
reth-storage-errors.workspace = true
reth-tasks = { workspace = true, features = ["rayon"] }
reth-trie.workspace = true

# alloy
alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true

# tracing
tracing.workspace = true

# revm
revm.workspace = true

# misc
thiserror.workspace = true
crossbeam-channel.workspace = true
crossbeam-utils = "0.8"

# `metrics` feature
reth-metrics = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }

# `trie-debug` feature
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false, optional = true, features = ["trie-debug"] }
rand = { workspace = true, optional = true }

[dev-dependencies]
# reth
reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
reth-trie-db.workspace = true
reth-trie = { workspace = true, features = ["test-utils"] }

# misc
rand.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = ["metrics"]
metrics = ["reth-metrics", "dep:metrics", "reth-trie/metrics"]
trie-debug = [
    "dep:rand",
    "dep:reth-trie-sparse",
    "reth-trie-sparse?/trie-debug",
]
test-utils = [
    "reth-primitives-traits/test-utils",
    "reth-provider/test-utils",
    "reth-trie-db/test-utils",
    "reth-trie/test-utils",
    "reth-tasks/test-utils",
    "reth-chainspec/test-utils",
    "reth-trie-sparse?/test-utils",
    "reth-ethereum-primitives/test-utils",
]
