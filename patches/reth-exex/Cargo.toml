[package]
name = "reth-exex"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Execution extensions for Reth [MANTLE PATCH: backport reth#26819 at aef8d3ef]"

[lints]
workspace = true

[dependencies]
## reth
reth-chain-state.workspace = true
reth-chainspec.workspace = true
reth-config = { git = "https://github.com/paradigmxyz/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
reth-evm.workspace = true
reth-exex-types = { git = "https://github.com/paradigmxyz/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", features = ["serde", "serde-bincode-compat"] }
reth-fs-util.workspace = true
reth-metrics.workspace = true
reth-node-api.workspace = true
reth-node-core.workspace = true
reth-primitives-traits.workspace = true
reth-ethereum-primitives.workspace = true
reth-provider.workspace = true
reth-prune-types.workspace = true
reth-revm.workspace = true
reth-stages-api = { git = "https://github.com/paradigmxyz/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
reth-tasks.workspace = true
reth-tracing.workspace = true
reth-payload-builder.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-eips.workspace = true

## async
futures.workspace = true
tokio-util.workspace = true
tokio.workspace = true

## misc
eyre.workspace = true
itertools = { version = "0.14", features = ["use_std"] }
metrics.workspace = true
parking_lot.workspace = true
rmp-serde = "1.3"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
reth-db-common.workspace = true
reth-evm-ethereum.workspace = true
reth-primitives-traits = { workspace = true, features = ["test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-testing-utils.workspace = true
reth-trie-common = { workspace = true, features = ["serde-bincode-compat"] }

alloy-genesis.workspace = true

rand.workspace = true
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "recovery"] }
tempfile.workspace = true

[features]
serde = [
    "reth-exex-types/serde",
    "reth-revm/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "parking_lot/serde",
    "rand/serde",
    "secp256k1/serde",
    "reth-primitives-traits/serde",
    "reth-trie-common/serde",
    "reth-prune-types/serde",
    "reth-config/serde",
    "reth-ethereum-primitives/serde",
    "reth-chain-state/serde",
]
