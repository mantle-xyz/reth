[package]
name = "reth-node-metrics"
version = "2.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Metrics utilities for the Reth node [MANTLE PATCH: backport reth#26734 at aef8d3ef]"

[dependencies]
reth-metrics.workspace = true
reth-tasks.workspace = true

metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-process.workspace = true
metrics-util.workspace = true

tokio.workspace = true

jsonrpsee-server.workspace = true
http = "1.0"
http-body-util = "0.1.2"
bytes.workspace = true
tower.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

tracing.workspace = true
eyre.workspace = true
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
jemalloc_pprof = { version = "0.8", default-features = false, optional = true }
mappings = { version = "0.7", optional = true }
pprof_util = { version = "0.8", optional = true }
reth-fs-util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["stats"] }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"

[dev-dependencies]
socket2 = { version = "0.6", default-features = false }

[lints]
workspace = true

[features]
jemalloc = ["dep:tikv-jemalloc-ctl"]
jemalloc-prof = ["jemalloc", "dep:jemalloc_pprof", "dep:mappings", "dep:pprof_util", "dep:reth-fs-util", "dep:tempfile"]
jemalloc-symbols = ["jemalloc-prof", "jemalloc_pprof?/symbolize"]
