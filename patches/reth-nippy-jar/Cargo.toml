[package]
name = "reth-nippy-jar"
version = "2.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Immutable data store format [MANTLE PATCH: vendored from ethereum-optimism/reth op-v2.6.0-1]"

[lints]
workspace = true

[lib]
name = "reth_nippy_jar"

[dependencies]
# reth
reth-fs-util.workspace = true

# compression
zstd = { workspace = true, features = ["experimental", "zdict_builder"] }
lz4_flex.workspace = true

memmap2 = { version = "0.9.11" }
bincode = { version = "1.3" }
smallvec.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing = { version = "0.1.0", default-features = false, features = ["attributes"] }
anyhow = { version = "1.0" }
thiserror.workspace = true
derive_more = { version = "2", default-features = false, features = ["full"] }

[dev-dependencies]
rand = { workspace = true, features = ["small_rng"] }
tempfile.workspace = true

[features]
default = []
test-utils = []
