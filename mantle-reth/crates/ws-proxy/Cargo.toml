[package]
name = "mantle-reth-ws-proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Flashblock websocket fan-out proxy — one upstream connection, many downstream subscribers"

[lints]
workspace = true

[[bin]]
name = "mantle-ws-proxy"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["ws", "query", "tokio", "http1"] }
backoff = { workspace = true }
brotli = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["env"] }
eyre = { workspace = true }
futures = { workspace = true }
ipnet = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
alloy-consensus = { workspace = true, features = ["std", "serde"] }
alloy-primitives = { workspace = true, features = ["std"] }
mantle-reth-flashblocks-types = { workspace = true }
op-alloy-consensus = { workspace = true, features = ["std", "serde"] }
tokio-tungstenite = { workspace = true }
