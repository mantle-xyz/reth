[package]
name = "mantle-reth-preconf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Mantle preconfirmation core types for op-reth"

[lints]
workspace = true

[dependencies]
# Alloy
alloy-primitives = { workspace = true, features = ["std", "serde"] }
alloy-consensus = { workspace = true, features = ["std"] }

# revm — for the builder's State / CacheState / TransitionState carry-forward
# helpers in `builder::state_carry`. Re-exports from reth-revm so we stay
# version-aligned with the rest of the reth payload-building stack.
reth-revm = { workspace = true, features = ["std"] }

# reth-evm — for the BlockBuilder / ExecutorTx traits used by apply_preconf_tx
reth-evm.workspace = true

# alloy-evm — for the TxResult trait + ExecutionResult re-exports
alloy-evm.workspace = true

# reth-transaction-pool — for the TransactionValidator trait wrapped by
# `PreconfAwareValidator` and the TransactionPool trait consumed by
# `PreconfPoolListener`
reth-transaction-pool.workspace = true

# futures — `StreamExt::next` used to drive
# `TransactionPool::new_pending_pool_transactions_listener` (returns a
# Stream rather than an mpsc::Receiver)
futures.workspace = true

# reth-optimism-txpool — for `OpPooledTx` trait bound on the wrapped tx type
reth-optimism-txpool.workspace = true

# reth-primitives-traits — for SealedBlock used in `on_new_head_block`
reth-primitives-traits.workspace = true

# OP-stack consensus types — listener bridges `OpTxEnvelope` to alloy
# `TxEnvelope` and drops Deposit / PostExec variants
op-alloy-consensus.workspace = true

# reth storage — RPC handler reads on-chain account nonce via
# `StateProviderFactory::latest()` + `StateProvider::account_nonce` to compute
# the pending nonce floor for the nonce-gap pre-check.
reth-storage-api.workspace = true

# reth-chain-state — `CanonStateSubscriptions` + `CanonStateNotification`
# stream consumed by the canonical-state handler.
reth-chain-state.workspace = true

# reth-execution-types — `Chain` type referenced by the canon handler's
# reorg observation helper.
reth-execution-types.workspace = true

# reth payload traits — `PayloadJob` + `PayloadJobGenerator` impls for the
# preconf payload-builder skeleton.
reth-payload-builder.workspace = true
reth-payload-builder-primitives.workspace = true
reth-payload-primitives.workspace = true

# reth rpc / jsonrpsee — RPC handler returns `RpcResult<PreconfTxEvent>`.
mantle-reth-rpc-ext.workspace = true
jsonrpsee = { workspace = true, features = ["server", "macros"] }
async-trait.workspace = true

# raw-tx decoding helper used by the RPC handler
reth-rpc-eth-types.workspace = true

# Async runtime + sync primitives
tokio = { workspace = true, features = ["sync", "macros", "time"] }

# Error handling
thiserror.workspace = true

# Tracing
tracing.workspace = true

# Serde
serde = { workspace = true, features = ["derive", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "test-util"] }
